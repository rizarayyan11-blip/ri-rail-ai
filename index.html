<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ri_rail AI</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #000;
  color: white;
}

.app {
  max-width: 600px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: #000;
}

/* HEADER */
.header {
  padding: 18px;
  background: #ff7a00;
  color: #000;
}

.title {
  font-size: 21px;
  font-weight: bold;
}

.online {
  font-size: 12px;
  margin-top: 3px;
}

/* AREA CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  background: #000;
}

.message {
  max-width: 82%;
  padding: 12px 15px;
  margin-bottom: 13px;
  border-radius: 16px;
  line-height: 1.45;
}

.ai {
  background: #191919;
  border: 1px solid #303030;
}

.user {
  background: #ff7a00;
  color: #000;
  margin-left: auto;
}

/* INPUT */
.bottom {
  display: flex;
  gap: 9px;
  padding: 10px;
  background: #000;
  border-top: 1px solid #222;
}

input {
  flex: 1;
  border: 1px solid #333;
  outline: none;
  border-radius: 25px;
  padding: 14px 17px;
  background: #111;
  color: white;
  font-size: 15px;
}

input::placeholder {
  color: #777;
}

/* TOMBOL */
button {
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  background: #ff7a00;
  color: #000;
  font-size: 20px;
  font-weight: bold;
}

button:active {
  transform: scale(0.94);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">Ri_rail AI</div>
    <div class="online">● Online</div>
  </div>

  <div class="chat" id="chat">

    <div class="message ai">
      Halo! 👋<br><br>
      Saya <b>Ri_rail AI</b> 🚆<br><br>
      Ada yang ingin kamu tanyakan?
    </div>

  </div>

  <div class="bottom">

    <input
      id="input"
      type="text"
      placeholder="Tulis pesan..."
    >

    <button onclick="sendMessage()">➤</button>

  </div>

</div>

<script>

function sendMessage() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if (!text) return;

  const user = document.createElement("div");

  user.className = "message user";
  user.textContent = text;

  chat.appendChild(user);

  input.value = "";

  chat.scrollTop = chat.scrollHeight;
}

<script>
async function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = text;
  chat.appendChild(user);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const loading = document.createElement("div");
  loading.className = "message ai";
  loading.textContent = "Ri_rail AI sedang berpikir...";
  chat.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Terjadi kesalahan");
    }

    loading.textContent = data.reply;

  } catch (error) {
    console.error(error);
    loading.textContent = "Maaf, terjadi kesalahan. Coba lagi.";
  }

  <div class="bottom">

  <input
    id="input"
    type="text"
    placeholder="Tulis pesan..."
  >

  <button type="button" onclick="sendMessage()">➤</button>

</div>
  }

  chat.scrollTop = chat.scrollHeight;
}
  
</script>

</body>
</html>
