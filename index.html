<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ri_rail AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #bdbdbd;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ATAS */
.header {
  height: 60px;
  background: #18a558;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
}

.title {
  font-size: 21px;
  font-weight: bold;
}

.delete {
  border: 0;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
}

/* CHAT */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.message {
  max-width: 80%;
  padding: 11px 14px;
  margin-bottom: 10px;
  border-radius: 15px;
  animation: muncul 0.25s ease;
}

.ai {
  background: #eeeeee;
  margin-right: auto;
}

.user {
  background: #18a558;
  color: white;
  margin-left: auto;
}

@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* BAWAH */
.bottom {
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #bdbdbd;
}

input {
  flex: 1;
  border: 0;
  outline: 0;
  border-radius: 25px;
  padding: 13px 16px;
  font-size: 15px;
}

.send {
  width: 50px;
  height: 50px;
  border: 0;
  border-radius: 50%;
  background: #18a558;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.send:active {
  transform: scale(0.92);
}

/* TITIK BERPIKIR */
.typing {
  display: flex;
  gap: 4px;
}

.dot {
  width: 6px;
  height: 6px;
  background: #777;
  border-radius: 50%;
  animation: titik 1s infinite;
}

.dot:nth-child(2) {
  animation-delay: 0.15s;
}

.dot:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes titik {
  0%, 100% {
    opacity: 0.3;
  }
  50% {
    opacity: 1;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">Ri_rail AI</div>

    <button class="delete" onclick="hapusChat()">🗑️</button>
  </div>

  <div class="chat" id="chat">

    <div class="message ai">
      Halo! 👋<br>
      Saya Ri_rail AI 🚆
    </div>

  </div>

  <div class="bottom">

    <input
      id="input"
      type="text"
      placeholder="Tulis pesan..."
      onkeydown="enterKirim(event)"
    >

    <button
      class="send"
      onclick="kirim()">
      ➤
    </button>

  </div>

</div>

<script>

async function kirim() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const pesan = input.value.trim();

  if (!pesan) return;

  /* PESAN USER */
  const user = document.createElement("div");

  user.className = "message user";
  user.textContent = pesan;

  chat.appendChild(user);

  input.value = "";

  chat.scrollTop = chat.scrollHeight;


  /* JEDA */
  await new Promise(function(resolve) {
    setTimeout(resolve, 250);
  });


  /* ANIMASI BERPIKIR */
  const loading = document.createElement("div");

  loading.className = "message ai";

  loading.innerHTML =
    '<div class="typing">' +
    '<span class="dot"></span>' +
    '<span class="dot"></span>' +
    '<span class="dot"></span>' +
    '</div>';

  chat.appendChild(loading);

  chat.scrollTop = chat.scrollHeight;


  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: pesan
      })

    });


    const data = await response.json();


    if (!response.ok) {
      throw new Error(
        data.error || "Error"
      );
    }


    /* JEDA SEBELUM JAWABAN */
    await new Promise(function(resolve) {
      setTimeout(resolve, 250);
    });


    loading.textContent = "";


    /* JAWABAN MUNCUL PERLAHAN */
    const jawaban =
      data.reply || "Tidak ada jawaban.";

    let i = 0;

    function tampil() {

      if (i < jawaban.length) {

        loading.textContent += jawaban[i];

        i++;

        chat.scrollTop =
          chat.scrollHeight;

        setTimeout(tampil, 18);

      }

    }

    tampil();

  }

  catch (error) {

    console.error(error);

    loading.textContent =
      "Ri_rail AI mengalami kesalahan.";

  }

}


/* ENTER */
function enterKirim(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    kirim();

  }

}


/* HAPUS CHAT */
function hapusChat() {

  document.getElementById("chat").innerHTML = "";

}

</script>

</body>
</html>
