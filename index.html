<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ri_rail AI</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #bdbdbd;
}

body {
  overflow: hidden;
}

.app {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  height: 60px;
  min-height: 60px;
  background: #18a558;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
}

.title {
  color: white;
  font-size: 21px;
  font-weight: bold;
}

.delete-button {
  border: 0;
  background: transparent;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

/* CHAT */
.chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 15px;
}

.message {
  max-width: 82%;
  width: fit-content;
  padding: 11px 14px;
  margin-bottom: 10px;
  border-radius: 16px;
  line-height: 1.45;
  word-break: break-word;
  animation: appear 0.2s ease;
}

.ai {
  background: #eeeeee;
  color: #111;
  margin-right: auto;
}

.user {
  background: #18a558;
  color: white;
  margin-left: auto;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(7px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* TYPING */
.typing {
  display: flex;
  gap: 4px;
  align-items: center;
  height: 18px;
}

.dot {
  width: 6px;
  height: 6px;
  background: #777;
  border-radius: 50%;
  animation: dot 1s infinite;
}

.dot:nth-child(2) {
  animation-delay: .15s;
}

.dot:nth-child(3) {
  animation-delay: .3s;
}

@keyframes dot {
  0%, 60%, 100% {
    opacity: .3;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-3px);
  }
}

/* INPUT */
.bottom {
  min-height: 70px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  background: #bdbdbd;
}

#input {
  flex: 1;
  min-width: 0;
  height: 50px;
  border: 0;
  outline: 0;
  border-radius: 25px;
  padding: 0 17px;
  font-size: 15px;
}

.send-button {
  width: 50px;
  height: 50px;
  border: 0;
  border-radius: 50%;
  background: #18a558;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.send-button:disabled {
  opacity: .55;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">Ri_rail AI</div>

    <button
      class="delete-button"
      type="button"
      onclick="clearChat()">
      🗑️
    </button>
  </div>

  <div class="chat" id="chat">

    <div class="message ai">
      Halo! 👋<br>
      Saya <b>Ri_rail AI</b> 🚆
    </div>

  </div>

  <div class="bottom">

    <input
      id="input"
      type="text"
      placeholder="Tulis pesan..."
      autocomplete="off">

    <button
      id="sendButton"
      class="send-button"
      type="button"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("sendButton");

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function scrollChat() {
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(text, type) {
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);

  scrollChat();

  return message;
}

function addTyping() {
  const message = document.createElement("div");

  message.className = "message ai";

  message.innerHTML =
    '<div class="typing">' +
      '<span class="dot"></span>' +
      '<span class="dot"></span>' +
      '<span class="dot"></span>' +
    '</div>';

  chat.appendChild(message);

  scrollChat();

  return message;
}

async function typeAnswer(element, text) {

  element.textContent = "";

  for (let i = 0; i < text.length; i++) {

    element.textContent += text[i];

    scrollChat();

    await sleep(15);
  }
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text || sendButton.disabled) {
    return;
  }

  addMessage(text, "user");

  input.value = "";

  sendButton.disabled = true;

  await sleep(250);

  const typing = addTyping();

  try {

    /* MEMANGGIL BACKEND VERCEL */
    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Backend error"
      );
    }

    if (!data.reply) {
      throw new Error(
        "Backend tidak mengirim reply."
      );
    }

    await sleep(250);

    await typeAnswer(
      typing,
      data.reply
    );

  } catch (error) {

    console.error(error);

    typing.textContent =
      "Error: " + error.message;

  }

  sendButton.disabled = false;

  input.focus();

  scrollChat();
}

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendMessage();

  }

});

function clearChat() {
  chat.innerHTML = "";
  input.focus();
}

</script>

</body>
</html>
